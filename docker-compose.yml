services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_URL: ${BASE_URL:-http://localhost:8080}
        CACHE_BUST: ${CACHE_BUST:-}
        NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
        NOCODB_BASE_URL: ${NOCODB_BASE_URL:-}
        NOCODB_TABLE_ID: ${NOCODB_TABLE_ID:-}
        NOCODB_VIEW_ID: ${NOCODB_VIEW_ID:-}
        NOCODB_PAGE_SIZE: ${NOCODB_PAGE_SIZE:-}
        NOCODB_USER_STORIES_TABLE_ID: ${NOCODB_USER_STORIES_TABLE_ID:-}
        NOCODB_USER_STORIES_VIEW_ID: ${NOCODB_USER_STORIES_VIEW_ID:-}
        NOCODB_REF_ENTITIES_TABLE_ID: ${NOCODB_REF_ENTITIES_TABLE_ID:-}
        NOCODB_REF_ENTITIES_VIEW_ID: ${NOCODB_REF_ENTITIES_VIEW_ID:-}
        NOCODB_PARTNERS_TABLE_ID: ${NOCODB_PARTNERS_TABLE_ID:-}
        NOCODB_PARTNERS_VIEW_ID: ${NOCODB_PARTNERS_VIEW_ID:-}
        FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-}
        FETCH_RETRIES: ${FETCH_RETRIES:-}
    image: base4nfdi-dashboard:latest
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
