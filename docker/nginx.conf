server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Zola emits directory/index.html; also allow .html fallbacks
    location / {
        # Revalidate pages so deployments expose new fingerprinted asset URLs.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    location = /data.json {
        add_header Cache-Control "public, max-age=60";
    }

    location ~* \.(?:css|js|mjs|map|svg|png|jpe?g|gif|ico|webp|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Do not leak nginx version
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
