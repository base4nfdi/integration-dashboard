<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title | default(value="Dashboard") }}{% endblock %}</title>
  <link rel="icon" href="{{ get_url(path='favicon.ico') | safe }}" type="image/x-icon">
  <script>
    (function () {
      var stored = localStorage.getItem("base4nfdi-theme");
      var pref = stored === "light" || stored === "dark" ? stored : "system";
      var theme = pref !== "system"
        ? pref
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-theme-pref", pref);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="{{ get_url(path='fonts/fonts.css') | safe }}">
  <link rel="stylesheet" href="{{ get_url(path='main.css') | safe }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="{{ get_url(path='/') | safe }}">
        <img
          class="site-logo"
          src="{{ get_url(path='img/Logo_base4NFDI_kurz_neg_rgb.png') | safe }}"
          alt="Base4NFDI — Basic Services for NFDI"
          width="320"
          height="80"
        >
      </a>
      <div class="site-heading">
        <h1 class="site-title">{{ config.title | default(value="Dashboard") }}</h1>
        {% if config.description %}
        <!-- <p class="site-description">{{ config.description }}</p> -->
        {% endif %}
        <!-- <nav class="site-nav" aria-label="Main">
          <a href="{{ get_url(path='/') | safe }}">Dashboard</a>
          <a href="{{ get_url(path='@/integrations/_index.md') | safe }}">Integrations</a>
          <a href="{{ get_url(path='@/nfdi-articles.md') | safe }}">NFDI Articles</a>
        </nav> -->
      </div>
      <div class="theme-switch" id="theme-switch">
        <span class="theme-switch-thumb" aria-hidden="true"></span>
        <label class="theme-switch-option" data-theme-value="dark" title="Dark">
          <input class="theme-switch-input" type="radio" name="base4nfdi-theme" value="dark" aria-label="Dark">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a.7.7 0 0 0-.9-.9A9.9 9.9 0 1 0 21.3 15.5a.7.7 0 0 0-.9-.9z"/>
          </svg>
        </label>
        <label class="theme-switch-option" data-theme-value="system" title="System">
          <input class="theme-switch-input" type="radio" name="base4nfdi-theme" value="system" aria-label="System">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4.5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1zM8.5 20.5h7M12 16.5v4"/>
          </svg>
        </label>
        <label class="theme-switch-option" data-theme-value="light" title="Light">
          <input class="theme-switch-input" type="radio" name="base4nfdi-theme" value="light" aria-label="Light">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
          </svg>
        </label>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-partners" aria-label="Partners and funding">
        <a
          class="footer-logo footer-logo--nfdi"
          href="https://www.nfdi.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="nfdi-logo nfdi-logo--color"
            src="{{ get_url(path='img/footer/nfdi_rgb_Wortmarke.svg') | safe }}"
            alt="NFDI"
            width="293"
            height="136"
            loading="lazy"
          >
          <img
            class="nfdi-logo nfdi-logo--neg"
            src="{{ get_url(path='img/footer/nfdi_rgb_Wortmarke_neg.svg') | safe }}"
            alt=""
            width="293"
            height="136"
            loading="lazy"
            aria-hidden="true"
          >
        </a>
        <a
          class="footer-logo footer-logo--dfg"
          href="https://www.dfg.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/dfg_logo_schriftzug_blau_foerderung_en.gif') | safe }}"
            alt="Funded by DFG — German Research Foundation"
            width="800"
            height="260"
            loading="lazy"
          >
        </a>
        <a
          class="footer-logo footer-logo--denbi"
          href="https://www.denbi.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/denbi-logo-color.svg') | safe }}"
            alt="de.NBI — German Network for Bioinformatics Infrastructure"
            width="354"
            height="92"
            loading="lazy"
          >
        </a>
      </div>
      <nav class="footer-meta" aria-label="Site information">
        <p>Built with <a href="https://www.getzola.org/">Zola</a></p>
        <span class="footer-sep" aria-hidden="true"></span>
        <p><a href="{{ get_url(path='@/legal-notice.md') | safe }}">Legal notice</a></p>
        <span class="footer-sep" aria-hidden="true"></span>
        <a
          class="footer-logo footer-logo--cc"
          href="https://creativecommons.org/licenses/by/4.0/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/cc-by-4.0.png') | safe }}"
            alt="Creative Commons Attribution 4.0 International"
            width="403"
            height="141"
            loading="lazy"
          >
        </a>
      </nav>
    </div>
  </footer>
  <script src="{{ get_url(path='theme.js') | safe }}"></script>
</body>
</html>
