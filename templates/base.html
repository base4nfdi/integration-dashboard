<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title | default(value="Dashboard") }}{% endblock %}</title>
  <link rel="icon" href="{{ get_url(path='favicon.ico') | safe }}" type="image/x-icon">
  <script>
    (function () {
      var stored = localStorage.getItem("base4nfdi-theme");
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="{{ get_url(path='fonts/fonts.css') | safe }}">
  <link rel="stylesheet" href="{{ get_url(path='main.css') | safe }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="{{ get_url(path='/') | safe }}">
        <img
          class="site-logo"
          src="{{ get_url(path='img/Logo_base4NFDI_kurz_neg_rgb.png') | safe }}"
          alt="Base4NFDI — Basic Services for NFDI"
          width="320"
          height="80"
        >
      </a>
      <div class="site-heading">
        <h1 class="site-title">{{ config.title | default(value="Dashboard") }}</h1>
        {% if config.description %}
        <!-- <p class="site-description">{{ config.description }}</p> -->
        {% endif %}
        <!-- <nav class="site-nav" aria-label="Main">
          <a href="{{ get_url(path='/') | safe }}">Dashboard</a>
          <a href="{{ get_url(path='@/integrations/_index.md') | safe }}">Integrations</a>
          <a href="{{ get_url(path='@/nfdi-articles.md') | safe }}">NFDI Articles</a>
        </nav> -->
      </div>
      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-pressed="true"
        aria-label="Switch to light mode"
        title="Switch to light mode"
      >
        <span class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true">☀</span>
        <span class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true">☽</span>
        <span class="theme-toggle-label">Theme</span>
      </button>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-logos footer-logos--start" aria-label="Partners and funding">
        <a
          class="footer-logo footer-logo--nfdi"
          href="https://www.nfdi.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/nfdi_4c_Wortmarke-Cooperation-01.png') | safe }}"
            alt="In cooperation with NFDI"
            width="120"
            height="96"
            loading="lazy"
          >
        </a>
        <a
          class="footer-logo footer-logo--dfg"
          href="https://www.dfg.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/dfg_logo_schriftzug_blau_foerderung_en.gif') | safe }}"
            alt="Funded by DFG — German Research Foundation"
            width="200"
            height="65"
            loading="lazy"
          >
        </a>
      </div>
      <div class="footer-meta">
        <p>Built with <a href="https://www.getzola.org/">Zola</a></p>
        |
        <p class="footer-meta">
          <a href="{{ get_url(path='@/legal-notice.md') | safe }}">Legal notice</a>
        </p>
      </div>
      <div class="footer-logos footer-logos--end" aria-label="Hosting and license">
        <a
          class="footer-logo footer-logo--denbi"
          href="https://www.denbi.de/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/denbi-logo-color.svg') | safe }}"
            alt="de.NBI — German Network for Bioinformatics Infrastructure"
            width="180"
            height="47"
            loading="lazy"
          >
        </a>
        <a
          class="footer-logo footer-logo--cc"
          href="https://creativecommons.org/licenses/by/4.0/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="{{ get_url(path='img/footer/cc-by-4.0.png') | safe }}"
            alt="Creative Commons Attribution 4.0 International"
            width="88"
            height="31"
            loading="lazy"
          >
        </a>
      </div>
    </div>
  </footer>
  <script src="{{ get_url(path='theme.js') | safe }}"></script>
</body>
</html>
