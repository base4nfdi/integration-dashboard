{% extends "base.html" %}

{% block content %}
<section class="dashboard">
  <header class="dashboard-header">
    {% if section.content %}
    <div class="dashboard-intro">{{ section.content | safe }}</div>
    {% endif %}
  </header>

  <div class="summary-cards" id="summary-cards" aria-live="polite"></div>

  <div class="table-panel">
    <div class="table-panel-header">
      <h3>Integrations</h3>
      <p class="table-meta" id="table-meta">Loading data…</p>
    </div>

    <form class="filter-bar" id="filter-bar" hidden aria-label="Filter integrations">
      <div class="filter-groups" id="filter-groups-wrap">
        <div class="filter-chip-groups" id="filter-groups"></div>

        <div class="filter-group filter-consortia" id="filter-consortia" hidden>
          <span class="filter-group-label" id="consortia-label">Consortia involved</span>
          <div
            class="filter-combobox"
            id="consortia-combobox"
            data-open="false"
          >
            <div class="filter-combobox-control" id="consortia-control">
              <div class="filter-combobox-tags" id="consortia-tags"></div>
              <input
                type="text"
                class="filter-combobox-input"
                id="consortia-input"
                role="combobox"
                aria-expanded="false"
                aria-controls="consortia-listbox"
                aria-autocomplete="list"
                aria-labelledby="consortia-label"
                placeholder="Search consortia…"
                autocomplete="off"
                spellcheck="false"
              >
              <button
                type="button"
                class="filter-combobox-toggle"
                id="consortia-toggle"
                aria-label="Show consortia"
                tabindex="-1"
              >
                <span aria-hidden="true">▾</span>
              </button>
            </div>
            <ul
              class="filter-combobox-list"
              id="consortia-listbox"
              role="listbox"
              aria-labelledby="consortia-label"
              hidden
            ></ul>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button type="button" class="filter-clear" id="filter-clear" disabled>Clear filters</button>
        <div class="filter-search">
          <label class="visually-hidden" for="filter-search">Search table</label>
          <input
            type="search"
            id="filter-search"
            name="q"
            placeholder="Search all text columns…"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>
    </form>

    <div class="table-wrap">
      <table class="data-table" id="data-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  const dataUrl = "{{ get_url(path='data.json') | safe }}";
  const incubatorBaseUrl = "{{ get_url(path='@/integrations/_index.md') | safe }}";
  const staticRootUrl = "{{ get_url(path='/') | safe }}";

  /** Resolve remote or site-relative logo paths for <img src>. */
  function resolveAssetUrl(path) {
    const value = String(path || "").trim();
    if (!value) return "";
    if (/^(?:https?:|data:|\/\/)/i.test(value)) return value;
    const root = staticRootUrl.endsWith("/") ? staticRootUrl : staticRootUrl + "/";
    return root + value.replace(/^\//, "");
  }

  /** Basic-service codes → horizontal top logos. */
  const basicServiceLogos = {
    DMP: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_DMP4NFDI-top.png') | safe }}",
    IAM: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_IAM4NFDI-top.png') | safe }}",
    TS: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_TS4NFDI-top.png') | safe }}",
    ACCT: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_ACCT4NFDI-top.png') | safe }}",
    Jupyter: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_Jupyter4NFDI-top.png') | safe }}",
    KGI: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_KGI4NFDI-top.png') | safe }}",
    PID: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_PID4NFDI-top.png') | safe }}",
    RDMT: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_RDMT-top.png') | safe }}",
    RDMTraining: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_RDMT-top.png') | safe }}",
    Software: "{{ get_url(path='img/Base4NFDI-Logos/RGB/Logo-top/PNG/_nfdi-software-top.png') | safe }}",
  };

  const columns = [
    { key: "basic_service", label: "Basic service", type: "service" },
    { key: "logos", label: "Partners", type: "logos" },
    { key: "inc_name", label: "INCUBATOR/USE-CASE", type: "name" },
    { key: "inc_status", label: "Status", type: "status" },
    // { key: "inc_start", label: "Start", type: "date" },
    // { key: "inc_end", label: "End", type: "date" },
    { key: "inc_cycle", label: "Cycle" },
    // { key: "inc_descr", label: "Description", type: "markdown" },
    // { key: "inc_goals", label: "Goals", type: "markdown" },
    // { key: "inc_results", label: "Results", type: "markdown" },
    // { key: "inc_partner_publications", label: "Partner pubs" },
    { key: "partners", label: "Consortia involved", type: "list" },
    // { key: "linked_partners", label: "# Partners" },
    { key: "entities", label: "Institutions", type: "list" },
    // { key: "linked_entities", label: "# Entities" },
    { key: "related_institutions", label: "Further Institutions" },
  ];

  /** Discrete filters shown as checkbox groups. */
  const filterDefs = [
    { key: "basic_service", label: "Basic service" },
    { key: "inc_status", label: "Status" },
    // { key: "inc_cycle", label: "Cycle" },
  ];

  /** Multi-value field filtered via searchable tag combobox (any-match). */
  const consortiaFilterKey = "partners";

  /** Columns included in free-text search (excludes logos / non-text). */
  const searchableColumns = columns.filter((column) => column.type !== "logos");

  const state = {
    records: [],
    meta: null,
    search: "",
    filters: Object.fromEntries(filterDefs.map((def) => [def.key, new Set()])),
    consortia: new Set(),
    consortiaOptions: [],
    consortiaQuery: "",
    consortiaHighlight: -1,
  };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function statusClass(status) {
    return "status-" + status.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  }

  function formatDate(value) {
    if (!value) return "—";
    const date = new Date(value + "T00:00:00");
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric",
    });
  }

  function formatList(items) {
    if (!Array.isArray(items) || items.length === 0) return "—";
    return items.map(escapeHtml).join(", ");
  }

  function renderInlineMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    html = html.replace(
      /(^|[\s>(])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>'
    );
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    return html;
  }

  /** Minimal Markdown → HTML for NocoDB text fields (lists, links, emphasis). */
  function renderMarkdown(source) {
    const raw = String(source || "").replace(/\r\n/g, "\n").trim();
    if (!raw) return "";

    const blocks = [];
    let listItems = [];
    let paragraph = [];

    function flushList() {
      if (listItems.length === 0) return;
      blocks.push(
        "<ul>" +
          listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("") +
          "</ul>"
      );
      listItems = [];
    }

    function flushParagraph() {
      if (paragraph.length === 0) return;
      blocks.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
      paragraph = [];
    }

    for (const line of raw.split("\n")) {
      const listMatch = line.match(/^\s*[-*]\s+(.+)$/);
      if (listMatch) {
        flushParagraph();
        listItems.push(listMatch[1]);
        continue;
      }
      if (!line.trim()) {
        flushList();
        flushParagraph();
        continue;
      }
      flushList();
      paragraph.push(line.trim());
    }
    flushList();
    flushParagraph();
    return blocks.join("");
  }

  function cellText(column, record) {
    const value = record[column.key];
    if (column.type === "list") {
      return Array.isArray(value) ? value.join(" ") : "";
    }
    if (column.type === "date") {
      return value ? formatDate(value) : "";
    }
    if (value == null) return "";
    return String(value);
  }

  function recordSearchText(record) {
    return searchableColumns
      .map((column) => cellText(column, record))
      .join(" ")
      .toLowerCase();
  }

  function uniqueValues(records, key) {
    const values = new Set();
    for (const record of records) {
      const value = record[key];
      if (value == null || value === "") continue;
      values.add(String(value));
    }
    return Array.from(values).sort(compareFilterValues);
  }

  function normalizeListItem(value) {
    return String(value ?? "")
      .replace(/\r/g, "")
      .trim();
  }

  function uniqueListValues(records, key) {
    const values = new Set();
    for (const record of records) {
      const list = record[key];
      if (!Array.isArray(list)) continue;
      for (const item of list) {
        const normalized = normalizeListItem(item);
        if (!normalized) continue;
        values.add(normalized);
      }
    }
    return Array.from(values).sort(compareFilterValues);
  }

  function compareFilterValues(a, b) {
    const na = Number(a);
    const nb = Number(b);
    if (!Number.isNaN(na) && !Number.isNaN(nb) && String(na) === a && String(nb) === b) {
      return na - nb;
    }
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  }

  function hasActiveFilters() {
    if (state.search.trim()) return true;
    if (state.consortia.size > 0) return true;
    return filterDefs.some((def) => state.filters[def.key].size > 0);
  }

  function recordHasAnyConsortium(record, selected) {
    const partners = record[consortiaFilterKey];
    if (!Array.isArray(partners) || partners.length === 0) return false;
    for (const partner of partners) {
      if (selected.has(normalizeListItem(partner))) return true;
    }
    return false;
  }

  function filterRecords(records) {
    const query = state.search.trim().toLowerCase();
    return records.filter((record) => {
      for (const def of filterDefs) {
        const selected = state.filters[def.key];
        if (selected.size === 0) continue;
        const value = record[def.key];
        if (value == null || value === "" || !selected.has(String(value))) {
          return false;
        }
      }
      if (state.consortia.size > 0 && !recordHasAnyConsortium(record, state.consortia)) {
        return false;
      }
      if (!query) return true;
      return recordSearchText(record).includes(query);
    });
  }

  function filteredConsortiaOptions() {
    const query = state.consortiaQuery.trim().toLowerCase();
    return state.consortiaOptions.filter((option) => {
      if (state.consortia.has(option)) return false;
      if (!query) return true;
      return option.toLowerCase().includes(query);
    });
  }

  function renderSummary(records) {
    const total = records.length;
    const finished = records.filter((row) => row.inc_status === "Finished").length;
    const running = records.filter((row) => row.inc_status === "Running").length;
    const preparing = records.filter((row) => row.inc_status === "In preparation").length;
    const services = new Set(
      records.map((row) => row.basic_service).filter((value) => value)
    ).size;

    const cards = [
      { label: "Total integrations", value: total },
      { label: "Finished", value: finished },
      { label: "Running", value: running },
      { label: "In preparation", value: preparing },
      { label: "Basic services", value: services },
    ];

    document.getElementById("summary-cards").innerHTML = cards
      .map((card) => `
        <article class="summary-card">
          <p class="summary-label">${card.label}</p>
          <p class="summary-value">${card.value}</p>
        </article>
      `)
      .join("");
  }

  function incubatorUrl(record) {
    const external = String(record.source_url || "").trim();
    if (external && /^https?:\/\//i.test(external) && !record.key_article) {
      return external;
    }
    const base = incubatorBaseUrl.endsWith("/") ? incubatorBaseUrl : incubatorBaseUrl + "/";
    const service = String(record.basic_service || "")
      .trim()
      .toLowerCase();
    const slug = String(record.key_article || "").trim();
    if (!slug) return external || base;
    if (service) return base + service + "/" + slug + "/";
    return base + slug + "/";
  }

  function renderCell(column, record) {
    const value = record[column.key];

    if (column.type === "service") {
      const code = String(value || "").trim();
      if (!code) return "<td>—</td>";
      const src = basicServiceLogos[code];
      if (!src) return `<td>${escapeHtml(code)}</td>`;
      const serviceLabels = {
        Software: "nfdi.software",
        RDMT: "RDMTraining4NFDI",
        RDMTraining: "RDMTraining4NFDI",
      };
      const label = serviceLabels[code] || `${code}4NFDI`;
      return `
        <td class="row-service">
          <img
            class="service-logo"
            src="${escapeHtml(src)}"
            alt="${escapeHtml(label)}"
            title="${escapeHtml(label)}"
            loading="lazy"
            decoding="async"
          >
        </td>
      `;
    }

    if (column.type === "logos") {
      const project = resolveAssetUrl(record.logo_project);
      const consortia = resolveAssetUrl(record.logo_consortia);
      if (!project && !consortia) return `<td class="row-logos">—</td>`;
      const imgs = [];
      if (project) {
        imgs.push(`<img class="logo-img logo-project" src="${escapeHtml(project)}" alt="Project logo" loading="lazy" decoding="async">`);
      }
      if (consortia) {
        imgs.push(`<img class="logo-img logo-consortia" src="${escapeHtml(consortia)}" alt="Consortia logo" loading="lazy" decoding="async">`);
      }
      return `<td class="row-logos"><div class="logo-pair">${imgs.join("")}</div></td>`;
    }

    if (column.type === "name") {
      const text = escapeHtml(value || "—");
      const href = incubatorUrl(record);
      if (record.key_article || record.source_url) {
        // Report pages use absolute get_url() hrefs (same site) — only true
        // off-site source_url fallbacks should open a new tab.
        const external =
          !record.key_article &&
          /^https?:\/\//i.test(String(record.source_url || "").trim());
        const rel = external ? ' target="_blank" rel="noopener noreferrer"' : "";
        return `<td><a href="${escapeHtml(href)}"${rel}>${text}</a></td>`;
      }
      return `<td>${text}</td>`;
    }

    if (column.type === "status") {
      const text = value || "—";
      return `<td><span class="status-badge ${statusClass(text)}">${escapeHtml(text)}</span></td>`;
    }

    if (column.type === "date") {
      return `<td>${formatDate(value)}</td>`;
    }

    if (column.type === "list") {
      return `<td>${formatList(value)}</td>`;
    }

    if (column.type === "markdown") {
      const html = renderMarkdown(value);
      if (!html) return "<td>—</td>";
      return `<td class="cell-markdown"><div class="md-content">${html}</div></td>`;
    }

    if (value == null || value === "") return "<td>—</td>";
    return `<td>${escapeHtml(value)}</td>`;
  }

  function renderFilterBar(records) {
    const groups = document.getElementById("filter-groups");
    groups.innerHTML = filterDefs
      .map((def) => {
        const options = uniqueValues(records, def.key);
        if (options.length === 0) return "";
        const chips = options
          .map((option) => {
            const id = `filter-${def.key}-${option.replace(/[^a-zA-Z0-9_-]+/g, "-").toLowerCase()}`;
            const checked = state.filters[def.key].has(option) ? " checked" : "";
            return `
              <label class="filter-chip" for="${id}">
                <input type="checkbox" id="${id}" name="${escapeHtml(def.key)}" value="${escapeHtml(option)}"${checked}>
                <span>${escapeHtml(option)}</span>
              </label>
            `;
          })
          .join("");
        return `
          <fieldset class="filter-group">
            <legend>${escapeHtml(def.label)}</legend>
            <div class="filter-chip-list">${chips}</div>
          </fieldset>
        `;
      })
      .join("");

    state.consortiaOptions = uniqueListValues(records, consortiaFilterKey);
    const consortiaGroup = document.getElementById("filter-consortia");
    consortiaGroup.hidden = state.consortiaOptions.length === 0;
    renderConsortiaCombobox();

    document.getElementById("filter-bar").hidden = false;
  }

  function setConsortiaOpen(open) {
    const combobox = document.getElementById("consortia-combobox");
    const input = document.getElementById("consortia-input");
    const listbox = document.getElementById("consortia-listbox");
    combobox.dataset.open = open ? "true" : "false";
    input.setAttribute("aria-expanded", open ? "true" : "false");
    listbox.hidden = !open;
    if (!open) {
      state.consortiaHighlight = -1;
      input.removeAttribute("aria-activedescendant");
    }
  }

  function renderConsortiaTags() {
    const tags = document.getElementById("consortia-tags");
    const input = document.getElementById("consortia-input");
    const selected = Array.from(state.consortia).sort(compareFilterValues);
    tags.innerHTML = selected
      .map(
        (option) => `
          <span class="filter-combobox-tag">
            <span class="filter-combobox-tag-label">${escapeHtml(option)}</span>
            <button
              type="button"
              class="filter-combobox-tag-remove"
              data-value="${escapeHtml(option)}"
              aria-label="Remove ${escapeHtml(option)}"
            >×</button>
          </span>
        `
      )
      .join("");
    input.placeholder = selected.length === 0 ? "Search consortia…" : "Add another…";
  }

  function renderConsortiaList() {
    const listbox = document.getElementById("consortia-listbox");
    const input = document.getElementById("consortia-input");
    const options = filteredConsortiaOptions();

    if (state.consortiaHighlight >= options.length) {
      state.consortiaHighlight = options.length > 0 ? options.length - 1 : -1;
    }

    if (options.length === 0) {
      listbox.innerHTML = `
        <li class="filter-combobox-empty" role="presentation">
          ${state.consortiaQuery.trim() ? "No matching consortia" : "All consortia selected"}
        </li>
      `;
      input.removeAttribute("aria-activedescendant");
      return;
    }

    listbox.innerHTML = options
      .map((option, index) => {
        const id = `consortia-option-${index}`;
        const selected = index === state.consortiaHighlight;
        const activeClass = selected ? " is-active" : "";
        return `
          <li
            class="filter-combobox-option${activeClass}"
            id="${id}"
            role="option"
            data-value="${escapeHtml(option)}"
            aria-selected="${selected ? "true" : "false"}"
          >${escapeHtml(option)}</li>
        `;
      })
      .join("");

    if (state.consortiaHighlight >= 0) {
      input.setAttribute(
        "aria-activedescendant",
        `consortia-option-${state.consortiaHighlight}`
      );
      const activeEl = listbox.querySelector(".is-active");
      if (activeEl) {
        activeEl.scrollIntoView({ block: "nearest" });
      }
    } else {
      input.removeAttribute("aria-activedescendant");
    }
  }

  function renderConsortiaCombobox() {
    renderConsortiaTags();
    renderConsortiaList();
  }

  function addConsortium(value) {
    if (!value || state.consortia.has(value)) return;
    state.consortia.add(value);
    state.consortiaQuery = "";
    document.getElementById("consortia-input").value = "";
    state.consortiaHighlight = -1;
    renderConsortiaCombobox();
    setConsortiaOpen(true);
    applyView();
  }

  function removeConsortium(value) {
    if (!state.consortia.has(value)) return;
    state.consortia.delete(value);
    renderConsortiaCombobox();
    applyView();
  }

  function clearConsortiaFilter() {
    state.consortia.clear();
    state.consortiaQuery = "";
    state.consortiaHighlight = -1;
    const input = document.getElementById("consortia-input");
    if (input) input.value = "";
    setConsortiaOpen(false);
    renderConsortiaCombobox();
  }

  function renderTable(records, meta, totalCount) {
    const head = document.getElementById("table-head");
    const body = document.getElementById("table-body");

    head.innerHTML = `
      <tr>${columns.map((column) => `<th scope="col">${column.label}</th>`).join("")}</tr>
    `;

    if (records.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="${columns.length}" class="table-empty">
            No integrations match the current filters.
          </td>
        </tr>
      `;
    } else {
      body.innerHTML = records
        .map((record) => `<tr>${columns.map((column) => renderCell(column, record)).join("")}</tr>`)
        .join("");
    }

    const source = meta?.source === "nocodb" ? "NocoDB" : "dashboard data";
    const fetched = meta?.fetched_at
      ? ` · updated ${new Date(meta.fetched_at).toLocaleString()}`
      : "";
    const countLabel =
      records.length === totalCount
        ? `${records.length} row${records.length === 1 ? "" : "s"}`
        : `${records.length} of ${totalCount} rows`;
    document.getElementById("table-meta").textContent =
      `${countLabel} from ${source}${fetched}`;

    document.getElementById("filter-clear").disabled = !hasActiveFilters();
  }

  function applyView() {
    const filtered = filterRecords(state.records);
    renderSummary(filtered);
    renderTable(filtered, state.meta, state.records.length);
  }

  function bindFilterControls() {
    const searchInput = document.getElementById("filter-search");
    const filterBar = document.getElementById("filter-bar");
    const clearButton = document.getElementById("filter-clear");
    const consortiaInput = document.getElementById("consortia-input");
    const consortiaControl = document.getElementById("consortia-control");
    const consortiaListbox = document.getElementById("consortia-listbox");
    const consortiaToggle = document.getElementById("consortia-toggle");
    const consortiaCombobox = document.getElementById("consortia-combobox");

    filterBar.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    searchInput.addEventListener("input", () => {
      state.search = searchInput.value;
      applyView();
    });

    filterBar.addEventListener("change", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.type !== "checkbox") return;
      const key = input.name;
      if (!state.filters[key]) return;
      if (input.checked) state.filters[key].add(input.value);
      else state.filters[key].delete(input.value);
      applyView();
    });

    consortiaInput.addEventListener("input", () => {
      state.consortiaQuery = consortiaInput.value;
      state.consortiaHighlight = 0;
      renderConsortiaList();
      setConsortiaOpen(true);
    });

    consortiaInput.addEventListener("focus", () => {
      setConsortiaOpen(true);
      renderConsortiaList();
    });

    consortiaInput.addEventListener("keydown", (event) => {
      const options = filteredConsortiaOptions();
      const open = consortiaCombobox.dataset.open === "true";

      if (event.key === "ArrowDown") {
        event.preventDefault();
        if (!open) setConsortiaOpen(true);
        if (options.length === 0) return;
        state.consortiaHighlight =
          state.consortiaHighlight < options.length - 1
            ? state.consortiaHighlight + 1
            : 0;
        renderConsortiaList();
        return;
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        if (!open) setConsortiaOpen(true);
        if (options.length === 0) return;
        state.consortiaHighlight =
          state.consortiaHighlight > 0
            ? state.consortiaHighlight - 1
            : options.length - 1;
        renderConsortiaList();
        return;
      }

      if (event.key === "Enter") {
        if (!open || options.length === 0) return;
        event.preventDefault();
        const index = state.consortiaHighlight >= 0 ? state.consortiaHighlight : 0;
        addConsortium(options[index]);
        return;
      }

      if (event.key === "Escape") {
        if (!open) return;
        event.preventDefault();
        setConsortiaOpen(false);
        return;
      }

      if (event.key === "Backspace" && consortiaInput.value === "" && state.consortia.size > 0) {
        const selected = Array.from(state.consortia).sort(compareFilterValues);
        removeConsortium(selected[selected.length - 1]);
      }
    });

    consortiaControl.addEventListener("click", (event) => {
      const removeButton = event.target.closest(".filter-combobox-tag-remove");
      if (removeButton) {
        event.preventDefault();
        event.stopPropagation();
        removeConsortium(removeButton.dataset.value);
        consortiaInput.focus();
        return;
      }
      if (event.target.closest(".filter-combobox-toggle")) return;
      consortiaInput.focus();
      setConsortiaOpen(true);
      renderConsortiaList();
    });

    consortiaToggle.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      const open = consortiaCombobox.dataset.open === "true";
      if (open) {
        setConsortiaOpen(false);
      } else {
        consortiaInput.focus();
        setConsortiaOpen(true);
        renderConsortiaList();
      }
    });

    consortiaListbox.addEventListener("mousedown", (event) => {
      const option = event.target.closest(".filter-combobox-option");
      if (!option) return;
      event.preventDefault();
      addConsortium(option.dataset.value);
      consortiaInput.focus();
    });

    document.addEventListener("mousedown", (event) => {
      if (!consortiaCombobox.contains(event.target)) {
        setConsortiaOpen(false);
      }
    });

    clearButton.addEventListener("click", () => {
      state.search = "";
      searchInput.value = "";
      for (const def of filterDefs) state.filters[def.key].clear();
      filterBar
        .querySelectorAll('input[type="checkbox"]')
        .forEach((input) => {
          input.checked = false;
        });
      clearConsortiaFilter();
      applyView();
    });
  }

  async function loadDashboard() {
    try {
      const response = await fetch(dataUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      const records = Array.isArray(payload?.records) ? payload.records : [];
      if (records.length === 0) throw new Error("No integration records found");

      state.records = records;
      state.meta = payload;
      renderFilterBar(records);
      applyView();
    } catch (error) {
      document.getElementById("table-meta").textContent = "Failed to load dashboard data";
      document.getElementById("table-body").innerHTML = `
        <tr><td colspan="${columns.length}">Could not load dashboard data: ${escapeHtml(error.message)}</td></tr>
      `;
    }
  }

  bindFilterControls();
  loadDashboard();
})();
</script>
{% endblock %}
