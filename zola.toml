#:tombi schema.strict = false
title = "Integration Dashboard - Base4NFDI"
description = "General overview of status of incubators and use cases related to Basic Services within NFDI."

# The URL the site will be built for
base_url = "http://dashboard.localhost"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[extra]
# Shows the "Preview" badge in the header and asks search engines not to index the site.
# Set to false once the site is officially published.
preview = true

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"
